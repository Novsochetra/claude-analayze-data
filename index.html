<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Analyzer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080a0d;--s1:#0e1117;--s2:#151920;
  --b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.12);
  --tx:#dde1e7;--mu:#5a6270;--mu2:#7a8390;
  --acc:#f7931a;--acc3:rgba(247,147,26,0.08);
  --grn:#1db954;--grn2:rgba(29,185,84,0.12);
  --red:#e03b3b;--red2:rgba(224,59,59,0.12);
  --ylw:#d4a800;--ylw2:rgba(212,168,0,0.12);
  --pur:#a855f7;--pur2:rgba(168,85,247,0.15);
}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}
.hdr{background:var(--s1);border-bottom:1px solid var(--b1);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--acc)}
.pill{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:3px 8px;border-radius:4px;border:1px solid;white-space:nowrap}
.p-acc{background:var(--acc3);color:var(--acc);border-color:rgba(247,147,26,0.3)}
.p-grn{background:var(--grn2);color:var(--grn);border-color:rgba(29,185,84,0.3)}
.p-red{background:var(--red2);color:var(--red);border-color:rgba(224,59,59,0.3)}
.p-mu{background:rgba(90,98,112,0.12);color:var(--mu2);border-color:rgba(90,98,112,0.25)}
.p-ylw{background:var(--ylw2);color:var(--ylw);border-color:rgba(212,168,0,0.3)}
.p-pur{background:var(--pur2);color:var(--pur);border-color:rgba(168,85,247,0.3)}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 50px)}
.side{background:var(--s1);border-right:1px solid var(--b1);padding:16px;display:flex;flex-direction:column;gap:13px;overflow-y:auto}
.sec-lbl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.8px;color:var(--mu);text-transform:uppercase;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--mu2)}
.field select,.field input,.field textarea{background:var(--bg);border:1px solid var(--b2);border-radius:6px;color:var(--tx);font-family:'Space Mono',monospace;font-size:11px;padding:7px 9px;outline:none;transition:border-color .2s;width:100%}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--acc)}
.field select option{background:#1a1e25}
.field textarea{resize:vertical;min-height:55px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.divider{border:none;border-top:1px solid var(--b1)}
/* goal card in sidebar */
.goal-card{background:linear-gradient(135deg,rgba(247,147,26,0.12),rgba(247,147,26,0.04));border:1px solid rgba(247,147,26,0.3);border-radius:8px;padding:12px 14px}
.goal-title{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--acc);margin-bottom:10px}
.goal-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.goal-lbl{font-size:11px;color:var(--mu2)}
.goal-val{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--acc)}
.btn-fetch{background:var(--s2);border:1px solid var(--b2);border-radius:7px;color:var(--tx);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.8px;padding:10px;cursor:pointer;width:100%;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-fetch:hover{border-color:var(--acc);color:var(--acc)}
.btn-fetch:disabled{opacity:.4;cursor:not-allowed}
.btn-analyze{background:var(--acc);border:none;border-radius:7px;color:#000;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.8px;padding:12px;cursor:pointer;width:100%;transition:all .2s}
.btn-analyze:hover{background:#ffaa33;transform:translateY(-1px)}
.btn-analyze:disabled{background:#252525;color:#444;cursor:not-allowed;transform:none}
.snap-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.snap-card{background:var(--s2);border:1px solid var(--b1);border-radius:7px;padding:9px 11px}
.sc-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:1px;margin-bottom:4px}
.sc-val{font-family:'Space Mono',monospace;font-size:12px;font-weight:700}
.sc-sub{font-size:10px;color:var(--mu2);margin-top:2px}
.c-grn{color:var(--grn)}.c-red{color:var(--red)}.c-acc{color:var(--acc)}.c-ylw{color:var(--ylw)}
.output{padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mu);padding:40px}
.empty-ico{font-size:26px;opacity:.2}

/* PROFIT TARGET BANNER */
.profit-banner{background:linear-gradient(135deg,rgba(29,185,84,0.15),rgba(29,185,84,0.05));border:1px solid rgba(29,185,84,0.35);border-radius:12px;padding:16px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pb-box{display:flex;flex-direction:column;gap:4px}
.pb-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:1px}
.pb-val{font-family:'Space Mono',monospace;font-size:16px;font-weight:700}
.pb-sub{font-size:10px;color:var(--mu2)}

/* SIGNAL CARD */
.sig-card{background:var(--s1);border:1px solid var(--b1);border-radius:12px;overflow:hidden}
.sig-hdr{padding:13px 17px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.sig-hdr-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sig-badge{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;padding:6px 18px;border-radius:6px;letter-spacing:1px}
.sb-long{background:var(--grn2);color:var(--grn);border:1px solid rgba(29,185,84,.4)}
.sb-short{background:var(--red2);color:var(--red);border:1px solid rgba(224,59,59,.4)}
.sb-wait{background:var(--ylw2);color:var(--ylw);border:1px solid rgba(212,168,0,.4)}
.sb-neutral{background:rgba(90,98,112,.15);color:var(--mu2);border:1px solid rgba(90,98,112,.3)}
.conf-wrap{display:flex;align-items:center;gap:7px}
.conf-lbl{font-size:11px;color:var(--mu)}
.conf-bar{width:80px;height:4px;background:var(--b2);border-radius:2px;overflow:hidden}
.conf-fill{height:100%;background:var(--acc);border-radius:2px}
.conf-pct{font-family:'Space Mono',monospace;font-size:11px;color:var(--acc);min-width:32px}
.sig-body{padding:16px;display:flex;flex-direction:column;gap:13px}

/* LEVELS */
.lvl-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.lvl-box{background:var(--s2);border-radius:8px;padding:11px 13px}
.lvl-name{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:1px;margin-bottom:5px}
.lvl-val{font-family:'Space Mono',monospace;font-size:14px;font-weight:700}
.lv-e{color:var(--tx)}.lv-t{color:var(--grn)}.lv-s{color:var(--red)}.lv-acc{color:var(--acc)}
.lvl-sub{font-size:10px;color:var(--mu2);margin-top:3px}

/* TRIGGER CARD */
.trigger-card{background:var(--s2);border:1px solid rgba(168,85,247,.25);border-radius:10px;overflow:hidden}
.trigger-hdr{background:rgba(168,85,247,0.1);padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(168,85,247,.15)}
.trigger-hdr-title{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--pur)}
.trigger-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.trigger-step{display:flex;gap:12px;align-items:flex-start}
.step-num{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--pur);background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,.3);border-radius:5px;padding:3px 8px;white-space:nowrap;flex-shrink:0}
.step-title{font-size:12px;font-weight:600;color:var(--tx);margin-bottom:3px}
.step-desc{font-size:12px;color:var(--mu2);line-height:1.7}
.step-code{font-family:'Space Mono',monospace;font-size:11px;background:var(--bg);border:1px solid var(--b2);border-radius:5px;padding:6px 10px;margin-top:6px;color:var(--acc);line-height:1.8}

/* SECTION BOX */
.sec-box{background:var(--s2);border-radius:8px;padding:12px 14px}
.sec-box-title{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase;margin-bottom:9px}
.sec-txt{font-size:13px;line-height:1.8;color:var(--tx)}
.tag-row{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10px;padding:3px 8px;border-radius:4px;background:var(--s1);border:1px solid var(--b2);color:var(--tx);font-family:'Space Mono',monospace}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.plan-box{background:var(--s2);border-radius:8px;padding:11px 13px}
.plan-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:1px;margin-bottom:6px}
.plan-val{font-size:12px;line-height:1.75;color:var(--tx)}
.warn-box{background:var(--ylw2);border:1px solid rgba(212,168,0,.25);border-radius:8px;padding:12px 14px}
.warn-title{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--ylw);margin-bottom:7px}
.warn-item{font-size:12px;color:#c49a00;margin-bottom:3px}
.mkt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.mkt-card{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:11px 13px}
.mc-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:1px;margin-bottom:4px}
.mc-val{font-family:'Space Mono',monospace;font-size:12px;font-weight:700}
.mc-sub{font-size:10px;color:var(--mu2);margin-top:2px}
.chart-wrap{background:var(--s1);border:1px solid var(--b1);border-radius:12px;overflow:hidden}.chart-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.chart-hdr{padding:12px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:60px;flex:1}
.spinner{width:26px;height:26px;border:2px solid var(--b2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-family:'Space Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:1px}
.err-box{background:var(--red2);border:1px solid rgba(224,59,59,.3);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--red)}
.disclaimer{font-size:10px;color:var(--mu);text-align:center;padding:4px 0;font-family:'Space Mono',monospace}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.side{border-right:none;border-bottom:1px solid var(--b1)}.mkt-grid,.lvl-row,.plan-grid,.profit-banner{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="hdr">
  <span class="logo">BTC/USDT</span>
  <span class="pill p-acc">FUTURES ANALYZER</span>
  <span class="pill p-mu" id="fetch-status">NO DATA</span>
  <span class="pill p-mu" id="fetch-time"></span>
</div>

<div class="wrap">
  <div class="side">

    <!-- GOAL CARD -->
    <div class="goal-card">
      <div class="goal-title">YOUR TRADE GOAL</div>
      <div class="goal-row"><span class="goal-lbl">Capital</span><span class="goal-val" id="disp-capital">$2,500</span></div>
      <div class="goal-row"><span class="goal-lbl">Leverage</span><span class="goal-val" id="disp-lev">2x</span></div>
      <div class="goal-row"><span class="goal-lbl">Position Size</span><span class="goal-val" id="disp-pos">$5,000</span></div>
      <div class="goal-row"><span class="goal-lbl">Profit Target</span><span class="goal-val" id="disp-target">$60</span></div>
    </div>

    <!-- SETTINGS -->
    <div>
      <div class="sec-lbl">Settings</div>
      <div class="row2">
        <div class="field"><label>Capital ($)</label>
          <input type="number" id="capital" value="2500" min="100" onchange="updateGoal()">
        </div>
        <div class="field"><label>Leverage</label>
          <select id="leverage" onchange="updateGoal()">
            <option value="2" selected>2x</option>
            <option value="3">3x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-top:8px"><label>Profit Target ($)</label>
        <input type="number" id="profit-target" value="60" min="1" onchange="updateGoal()">
      </div>
    </div>

    <div class="row2">
      <div class="field"><label>Entry TF</label>
        <select id="entry-tf">
          <option value="15m" selected>15m</option>
          <option value="30m">30m</option>
          <option value="1h">1h</option>
        </select>
      </div>
      <div class="field"><label>Candles</label>
        <select id="limit">
          <option value="100" selected>100</option>
          <option value="200">200</option>
        </select>
      </div>
    </div>

    <button class="btn-fetch" id="fetch-btn" onclick="fetchAll()">
      <span id="fetch-ico">↓</span>
      <span id="fetch-lbl">FETCH BINANCE DATA</span>
    </button>

    <div id="snap-wrap" style="display:none">
      <div class="sec-lbl">Live Snapshot</div>
      <div class="snap-grid" id="snap-grid"></div>
    </div>

    <hr class="divider">

    <div class="field"><label>Key S/R Levels (optional)</label>
      <input type="text" id="sr" placeholder="Support: 83000, Res: 85500">
    </div>
    <div class="field"><label>Notes / Strategy</label>
      <textarea id="strategy" placeholder="e.g. only trade NY session, avoid news..."></textarea>
    </div>

    <button class="btn-analyze" id="analyze-btn" onclick="analyze()" disabled>ANALYZE → GET TRADE PLAN</button>
  </div>

  <div class="output" id="output">
    <div class="empty">
      <div class="empty-ico">◈</div>
      <p>Fetch data → Analyze</p>
      <p style="font-size:11px;margin-top:4px;color:var(--mu)">Goal-based analysis — exact TP to hit $60</p>
    </div>
  </div>
</div>

<script>
const TZ='Asia/Phnom_Penh';
const PROXY='https://odd-bird-d4a1.sochetra12-nov.workers.dev/';
let cachedData=null;

function ppTime(ts){ return new Date(ts||Date.now()).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:TZ}); }
function ppDT(ts){ return new Date(ts||Date.now()).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:TZ}); }

function updateGoal(){
  const cap=parseFloat(document.getElementById('capital').value)||2500;
  const lev=parseFloat(document.getElementById('leverage').value)||2;
  const tgt=parseFloat(document.getElementById('profit-target').value)||60;
  const pos=cap*lev;
  document.getElementById('disp-capital').textContent='$'+cap.toLocaleString();
  document.getElementById('disp-lev').textContent=lev+'x';
  document.getElementById('disp-pos').textContent='$'+pos.toLocaleString();
  document.getElementById('disp-target').textContent='$'+tgt;
}

function getGoal(){
  const cap=parseFloat(document.getElementById('capital').value)||2500;
  const lev=parseFloat(document.getElementById('leverage').value)||2;
  const tgt=parseFloat(document.getElementById('profit-target').value)||60;
  return {cap,lev,pos:cap*lev,tgt};
}

/* ── FETCH ── */
async function fetchBinance(url){ const r=await fetch(url); if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); }

async function fetchAll(){
  const entryTf=document.getElementById('entry-tf').value;
  const limit=document.getElementById('limit').value;
  const btn=document.getElementById('fetch-btn');
  btn.disabled=true; document.getElementById('fetch-ico').textContent='⟳'; document.getElementById('fetch-lbl').textContent='FETCHING...';
  try{
    const B='https://fapi.binance.com';
    const [eK,tK,dK,fR,oI,t24,pI]=await Promise.all([
      fetchBinance(`${B}/fapi/v1/klines?symbol=BTCUSDT&interval=${entryTf}&limit=${limit}`),
      fetchBinance(`${B}/fapi/v1/klines?symbol=BTCUSDT&interval=4h&limit=60`),
      fetchBinance(`${B}/fapi/v1/klines?symbol=BTCUSDT&interval=1d&limit=14`),
      fetchBinance(`${B}/fapi/v1/fundingRate?symbol=BTCUSDT&limit=8`),
      fetchBinance(`${B}/fapi/v1/openInterest?symbol=BTCUSDT`),
      fetchBinance(`${B}/fapi/v1/ticker/24hr?symbol=BTCUSDT`),
      fetchBinance(`${B}/fapi/v1/premiumIndex?symbol=BTCUSDT`)
    ]);
    const mapK=k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5],tbv:+k[9]});
    cachedData={
      entryTf,limit:+limit,
      entryKlines:eK.map(mapK), trendKlines:tK.map(mapK), dailyKlines:dK.map(mapK),
      fundingRates:fR.map(f=>({t:+f.fundingTime,rate:+f.fundingRate})),
      oi:{val:+oI.openInterest},
      t24:{price:+t24.lastPrice,chg:+t24.priceChangePercent,high:+t24.highPrice,low:+t24.lowPrice,vol:+t24.volume,qvol:+t24.quoteVolume},
      markPrice:+pI.markPrice, nextFunding:+pI.lastFundingRate,
      fetchedAt:Date.now()
    };
    renderSnap(cachedData);
    document.getElementById('fetch-status').textContent='LIVE';
    document.getElementById('fetch-status').className='pill p-grn';
    document.getElementById('fetch-time').textContent=ppTime()+' PP';
    document.getElementById('fetch-time').className='pill p-mu';
    document.getElementById('analyze-btn').disabled=false;
  }catch(err){
    setOutput('<div class="err-box">Fetch failed: '+err.message+'<br><br>Check your internet or VPN. Binance Futures API may be geo-blocked.</div>');
    document.getElementById('fetch-status').textContent='FAILED';
    document.getElementById('fetch-status').className='pill p-red';
  }finally{
    btn.disabled=false; document.getElementById('fetch-ico').textContent='↓'; document.getElementById('fetch-lbl').textContent='FETCH BINANCE DATA';
  }
}

function renderSnap(d){
  const fr=(d.nextFunding*100);
  const last4h=d.trendKlines[d.trendKlines.length-1];
  const lastD=d.dailyKlines[d.dailyKlines.length-1];
  const trend4hStr=last4h.c>last4h.o?'↑ BULL':'↓ BEAR';
  const trend4hCol=last4h.c>last4h.o?'c-grn':'c-red';
  const trendDStr=lastD.c>lastD.o?'↑ BULL':'↓ BEAR';
  const trendDCol=lastD.c>lastD.o?'c-grn':'c-red';
  document.getElementById('snap-grid').innerHTML=
    sc('MARK PRICE','$'+d.markPrice.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}),'c-acc',(d.t24.chg>=0?'+':'')+d.t24.chg.toFixed(2)+'% 24h')+
    sc('FUNDING',(fr>=0?'+':'')+fr.toFixed(4)+'%',(fr>0.01?'c-red':fr<-0.01?'c-grn':'c-ylw'),'next interval')+
    sc('4H BIAS',trend4hStr,trend4hCol,'$'+last4h.c.toFixed(0))+
    sc('1D BIAS',trendDStr,trendDCol,'$'+lastD.c.toFixed(0))+
    sc('OI',parseFloat(d.oi.val).toFixed(0),'','BTC contracts')+
    sc('24H HIGH','$'+d.t24.high.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}),'','Low: $'+d.t24.low.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}));
  document.getElementById('snap-wrap').style.display='block';
}
function sc(l,v,c,s){ return '<div class="snap-card"><div class="sc-lbl">'+l+'</div><div class="sc-val '+c+'">'+v+'</div><div class="sc-sub">'+s+'</div></div>'; }

/* ── PROMPT ── */
function buildPrompt(d,goal,sr,strategy){
  const fmtK=k=>(k.c>=k.o?'BULL':'BEAR')+' O:'+k.o.toFixed(1)+' H:'+k.h.toFixed(1)+' L:'+k.l.toFixed(1)+' C:'+k.c.toFixed(1)+' V:'+k.v.toFixed(2)+' BuyV:'+k.tbv.toFixed(2);
  const avgFr=(d.fundingRates.reduce((s,f)=>s+f.rate,0)/d.fundingRates.length*100).toFixed(4);
  const dHigh=Math.max(...d.dailyKlines.map(k=>k.h));
  const dLow=Math.min(...d.dailyKlines.map(k=>k.l));
  const entry50=d.entryKlines.slice(-50);
  const trend30=d.trendKlines.slice(-30);
  const pctNeeded=((goal.tgt/goal.pos)*100).toFixed(3);

  return `You are a professional BTC/USDT futures trader. Analyze all data and produce a precise trade plan.

TRADER GOAL:
- Capital: $${goal.cap} | Leverage: ${goal.lev}x | Position size: $${goal.pos}
- Profit target: $${goal.tgt} per trade
- % move needed to hit target: ${pctNeeded}% (this is the MINIMUM price move required)
- Time horizon: flexible — trader will hold as long as needed to hit $${goal.tgt}
- Current BTC price: $${d.markPrice.toFixed(2)}
- TP price for LONG = entry + (entry × ${pctNeeded}/100)
- TP price for SHORT = entry - (entry × ${pctNeeded}/100)

/* ── ANALYZE ── */
async function analyze(){
  if(!cachedData){alert('Fetch data first.');return;}
  const goal=getGoal();
  const sr=document.getElementById('sr').value;
  const strategy=document.getElementById('strategy').value;
  const btn=document.getElementById('analyze-btn');
  btn.disabled=true;
  setOutput('<div class="loading-wrap"><div class="spinner"></div><div class="loading-txt">ANALYZING... CALCULATING YOUR $'+goal.tgt+' TARGET...</div></div>');
  try{
    const res=await fetch(PROXY,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-opus-4-5',max_tokens:2000,
        system:'You are a professional crypto futures analyst. Respond with valid JSON only, no markdown.',
        messages:[{role:'user',content:buildPrompt(cachedData,goal,sr,strategy)}]
      })
    });
    const apiData=await res.json();
    const text=apiData.content?.find(b=>b.type==='text')?.text||'';
    const clean=text.replace(/```json|```/g,'').trim();
    const result=JSON.parse(clean);
    renderAll(result,cachedData,goal);
  }catch(err){
    setOutput('<div class="err-box">Analysis failed: '+err.message+'<br>Raw: '+(err.raw||'')+'</div>');
  }finally{btn.disabled=false;}
}

function setOutput(html){ document.getElementById('output').innerHTML=html; }

function num(v){ return v!=null?parseFloat(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:1}):'—'; }

function buildTriggerHtml(r){
  if(!r.trigger_rules||!r.trigger_rules.length) return '';
  return '<div class="trigger-card">'+
    '<div class="trigger-hdr"><span class="trigger-hdr-title">EXACT ENTRY TRIGGER — STEP BY STEP</span></div>'+
    '<div class="trigger-body">'+
      r.trigger_rules.map(s=>

          '<span class="step-num">'+s.step+'</span>'+
          '<div><div class="step-title">'+(s.title||'')+'</div>'+

          (s.condition?'<div class="step-code">'+s.condition+'</div>':'')+
          '</div></div>'
      ).join('')+
    '</div></div>';
}

/* ── CHART ── */
function drawChart(r,d){
  const canvas=document.getElementById('chart-canvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const candles=d.entryKlines.slice(-30);
  const tfMs={'15m':900000,'30m':1800000,'1h':3600000}[d.entryTf]||900000;
  const all=[...candles];
  const N=all.length;
  const DPR=window.devicePixelRatio||1;
  const CANDLE_W=16;
  const PAD={top:30,bottom:70,left:8,right:90};
  const chartH=400;
  const H=chartH+PAD.top+PAD.bottom;
  const W=PAD.left+PAD.right+N*CANDLE_W;
  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.scale(DPR,DPR);

  const cW=CANDLE_W;
  const bodyW=Math.max(3,cW-4);

  // collect all levels for price range
  const allH=all.map(k=>k.h);
  const allL=all.map(k=>k.l);
  const extras=[r.tp_price,r.sl,r.entry_zone_low,r.entry_zone_high,r.trend_target_low,r.trend_target_high].filter(Boolean).map(Number);
  const rawMax=Math.max(...allH,...extras);
  const rawMin=Math.min(...allL,...extras);
  const pad=(rawMax-rawMin)*0.05;
  const pMax=rawMax+pad; const pMin=rawMin-pad;
  const pRange=pMax-pMin||1;

  const py=p=>PAD.top+(1-(p-pMin)/pRange)*chartH;
  const cx=i=>PAD.left+i*CANDLE_W+CANDLE_W/2;

  // BG
  ctx.fillStyle='#080a0d'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0e1117'; ctx.fillRect(PAD.left,PAD.top,W-PAD.left-PAD.right,chartH);

  // Grid
  for(let i=0;i<=6;i++){
    const y=PAD.top+(chartH/6)*i;
    const price=pMax-((pMax-pMin)/6)*i;
    ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(PAD.left,y); ctx.lineTo(W-PAD.right,y); ctx.stroke();
    ctx.fillStyle='rgba(120,130,145,0.85)'; ctx.font='10px Space Mono,monospace';
    ctx.textAlign='left'; ctx.fillText('$'+price.toFixed(0),W-PAD.right+5,y+4);
  }
  for(let i=0;i<N;i+=5){
    ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(cx(i),PAD.top); ctx.lineTo(cx(i),PAD.top+chartH); ctx.stroke();
  }

  // TREND TARGET ZONE (shaded background)
  if(r.trend_target_low&&r.trend_target_high){
    const y1=py(+r.trend_target_high); const y2=py(+r.trend_target_low);
    const isUp=r.trend_direction==='UP';
    ctx.fillStyle=isUp?'rgba(29,185,84,0.06)':'rgba(224,59,59,0.06)';
    ctx.fillRect(PAD.left,Math.min(y1,y2),W-PAD.left-PAD.right,Math.abs(y2-y1));
    ctx.strokeStyle=isUp?'rgba(29,185,84,0.3)':'rgba(224,59,59,0.3)';
    ctx.lineWidth=1; ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(PAD.left,y1); ctx.lineTo(W-PAD.right,y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD.left,y2); ctx.lineTo(W-PAD.right,y2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=isUp?'rgba(29,185,84,0.9)':'rgba(224,59,59,0.9)';
    ctx.font='bold 9px Space Mono,monospace'; ctx.textAlign='left';
    ctx.fillText('TREND TARGET',PAD.left+6,Math.min(y1,y2)-5);
  }

  // ENTRY ZONE band
  if(r.entry_zone_low&&r.entry_zone_high){
    const y1=py(+r.entry_zone_high); const y2=py(+r.entry_zone_low);
    ctx.fillStyle='rgba(247,147,26,0.09)';
    ctx.fillRect(PAD.left,y1,W-PAD.left-PAD.right,y2-y1);
    ctx.strokeStyle='rgba(247,147,26,0.4)'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(PAD.left,y1); ctx.lineTo(W-PAD.right,y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD.left,y2); ctx.lineTo(W-PAD.right,y2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(247,147,26,0.95)'; ctx.font='bold 9px Space Mono,monospace'; ctx.textAlign='left';
    ctx.fillText('ENTRY ZONE',PAD.left+6,y1-5);
  }

  // Level lines
  if(r.tp_price){ lvLine(ctx,py(+r.tp_price),PAD.left,W-PAD.right,'rgba(29,185,84,0.8)','TP $'+num(r.tp_price)); }
  if(r.sl){       lvLine(ctx,py(+r.sl),       PAD.left,W-PAD.right,'rgba(224,59,59,0.8)','SL $'+num(r.sl)); }

  // Key support/resistance
  (r.key_levels&&r.key_levels.support||[]).forEach(l=>{
    const p=parseFloat(l); if(isNaN(p)) return;
    lvLine(ctx,py(p),PAD.left,W-PAD.right,'rgba(29,185,84,0.25)','S '+l,[3,4]);
  });
  (r.key_levels&&r.key_levels.resistance||[]).forEach(l=>{
    const p=parseFloat(l); if(isNaN(p)) return;
    lvLine(ctx,py(p),PAD.left,W-PAD.right,'rgba(224,59,59,0.25)','R '+l,[3,4]);
  });

  // CANDLES
  all.forEach((k,i)=>{
    const x=cx(i);
    const bull=k.c>=k.o;
    const col=bull?'#1db954':'#e03b3b';
    const wickCol=bull?'rgba(29,185,84,0.65)':'rgba(224,59,59,0.65)';

    // Wick
    ctx.strokeStyle=wickCol; ctx.lineWidth=1.5; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x,py(k.h)); ctx.lineTo(x,py(k.l)); ctx.stroke();

    // Body
    const top=py(Math.max(k.o,k.c));
    const bot=py(Math.min(k.o,k.c));
    const bh=Math.max(2,bot-top);
    ctx.fillStyle=col; ctx.fillRect(x-bodyW/2,top,bodyW,bh);
    ctx.strokeStyle=bull?'rgba(29,185,84,0.3)':'rgba(224,59,59,0.3)';
    ctx.lineWidth=0.5; ctx.strokeRect(x-bodyW/2,top,bodyW,bh);
  });

  // TIME LABELS — every candle, rotated 90deg
  ctx.font='9px Space Mono,monospace';
  all.forEach((k,i)=>{
    const x=cx(i);
    const t=new Date(k.t).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:TZ});
    ctx.save();
    ctx.translate(x, PAD.top+chartH+6);
    ctx.rotate(-Math.PI/2);
    ctx.fillStyle='rgba(100,115,135,0.85)';
    ctx.textAlign='left';
    ctx.fillText(t, 0, 0);
    ctx.restore();
  });

  // Separator
  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(PAD.left,PAD.top+chartH); ctx.lineTo(W-PAD.right,PAD.top+chartH); ctx.stroke();
}

function lvLine(ctx,y,x1,x2,color,label,dash){
  ctx.strokeStyle=color; ctx.lineWidth=1; ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=color; ctx.font='bold 9px Space Mono,monospace'; ctx.textAlign='left';
  ctx.fillText(label,x2+5,y+3);
}

updateGoal();
</script>
