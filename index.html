<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Analyzer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080a0d;--s1:#0e1117;--s2:#151920;--s3:#1c2028;
  --b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.12);--b3:rgba(255,255,255,0.2);
  --tx:#dde1e7;--mu:#5a6270;--mu2:#7a8390;
  --acc:#f7931a;--acc2:rgba(247,147,26,0.15);--acc3:rgba(247,147,26,0.08);
  --grn:#1db954;--grn2:rgba(29,185,84,0.12);
  --red:#e03b3b;--red2:rgba(224,59,59,0.12);
  --blu:#3b82f6;--blu2:rgba(59,130,246,0.12);
  --ylw:#d4a800;--ylw2:rgba(212,168,0,0.12);
}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}
/* HEADER */
.hdr{background:var(--s1);border-bottom:1px solid var(--b1);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.hdr-left{display:flex;align-items:center;gap:12px}
.logo{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--acc)}
.pill{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.2px;padding:3px 8px;border-radius:4px;border:1px solid}
.pill-acc{background:var(--acc3);color:var(--acc);border-color:rgba(247,147,26,0.3)}
.pill-grn{background:var(--grn2);color:var(--grn);border-color:rgba(29,185,84,0.3)}
.pill-red{background:var(--red2);color:var(--red);border-color:rgba(224,59,59,0.3)}
.pill-mu{background:rgba(90,98,112,0.15);color:var(--mu2);border-color:rgba(90,98,112,0.3)}
.pill-ylw{background:var(--ylw2);color:var(--ylw);border-color:rgba(212,168,0,0.3)}
.pill-blu{background:var(--blu2);color:var(--blu);border-color:rgba(59,130,246,0.3)}
.hdr-right{display:flex;align-items:center;gap:10px}
.cache-info{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:0.5px}
/* LAYOUT */
.wrap{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 53px)}
/* PANEL */
.panel{background:var(--s1);border-right:1px solid var(--b1);padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.sec-lbl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.8px;color:var(--mu);text-transform:uppercase;margin-bottom:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--mu2)}
.field select,.field input,.field textarea{
  background:var(--bg);border:1px solid var(--b2);border-radius:6px;
  color:var(--tx);font-family:'Space Mono',monospace;font-size:11px;
  padding:8px 10px;outline:none;transition:border-color 0.2s;width:100%
}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--acc)}
.field select option{background:#1a1e25}
.field textarea{resize:vertical;min-height:70px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{border:none;border-top:1px solid var(--b1)}
/* BUTTONS */
.btn-fetch{
  background:var(--s2);border:1px solid var(--b2);border-radius:7px;
  color:var(--tx);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.8px;
  padding:10px;cursor:pointer;width:100%;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px
}
.btn-fetch:hover{border-color:var(--acc);color:var(--acc)}
.btn-fetch:disabled{opacity:0.4;cursor:not-allowed}
.btn-analyze{
  background:var(--acc);border:none;border-radius:7px;color:#000;
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.8px;
  padding:12px;cursor:pointer;width:100%;transition:all 0.2s
}
.btn-analyze:hover{background:#ffaa33;transform:translateY(-1px)}
.btn-analyze:disabled{background:#2a2a2a;color:#555;cursor:not-allowed;transform:none}
.btn-clear{
  background:transparent;border:1px solid var(--b1);border-radius:6px;
  color:var(--mu);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.5px;
  padding:6px 10px;cursor:pointer;transition:all 0.2s
}
.btn-clear:hover{border-color:var(--red);color:var(--red)}
/* DATA CARDS */
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.data-card{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:10px 12px}
.dc-label{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:1px;margin-bottom:5px}
.dc-val{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--tx)}
.dc-sub{font-size:10px;color:var(--mu2);margin-top:2px}
.dc-grn{color:var(--grn)}
.dc-red{color:var(--red)}
.dc-acc{color:var(--acc)}
/* CANDLE MINI TABLE */
.mini-table{background:var(--bg);border:1px solid var(--b1);border-radius:6px;padding:8px;font-family:'Space Mono',monospace;font-size:9px;max-height:120px;overflow-y:auto;line-height:2}
.mt-head{display:grid;grid-template-columns:52px repeat(5,1fr);gap:3px;color:var(--mu)}
.mt-row{display:grid;grid-template-columns:52px repeat(5,1fr);gap:3px}
.mt-bull{color:var(--grn)}
.mt-bear{color:var(--red)}
/* OUTPUT */
.output{padding:24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mu)}
.empty-ico{font-size:28px;opacity:0.2}
/* SIGNAL CARD */
.sig-card{background:var(--s1);border:1px solid var(--b1);border-radius:12px;overflow:hidden}
.sig-hdr{padding:14px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.sig-hdr-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sig-badge{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;padding:6px 16px;border-radius:6px;letter-spacing:1px}
.sb-long{background:var(--grn2);color:var(--grn);border:1px solid rgba(29,185,84,0.35)}
.sb-short{background:var(--red2);color:var(--red);border:1px solid rgba(224,59,59,0.35)}
.sb-wait{background:var(--ylw2);color:var(--ylw);border:1px solid rgba(212,168,0,0.35)}
.sb-neutral{background:rgba(90,98,112,0.15);color:var(--mu2);border:1px solid rgba(90,98,112,0.3)}
.conf-wrap{display:flex;align-items:center;gap:8px}
.conf-lbl{font-size:11px;color:var(--mu)}
.conf-bar{width:80px;height:3px;background:var(--b2);border-radius:2px;overflow:hidden}
.conf-fill{height:100%;background:var(--acc);border-radius:2px;transition:width 0.6s ease}
.conf-pct{font-family:'Space Mono',monospace;font-size:11px;color:var(--acc);min-width:32px}
.sig-body{padding:18px;display:flex;flex-direction:column;gap:14px}
/* LEVELS */
.lvl-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvl-box{background:var(--s2);border-radius:8px;padding:12px 14px}
.lvl-name{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:1px;margin-bottom:6px}
.lvl-val{font-family:'Space Mono',monospace;font-size:15px;font-weight:700}
.lv-e{color:var(--tx)}.lv-t{color:var(--grn)}.lv-s{color:var(--red)}
.lvl-sub{font-size:10px;color:var(--mu2);margin-top:3px}
/* SECTIONS */
.sec-box{background:var(--s2);border-radius:8px;padding:13px 15px}
.sec-box-title{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase;margin-bottom:10px}
.analysis-txt{font-size:13px;line-height:1.8;color:var(--tx);white-space:pre-wrap}
.tag-row{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10px;padding:3px 9px;border-radius:4px;background:var(--s1);border:1px solid var(--b2);color:var(--tx);font-family:'Space Mono',monospace}
/* MARKET OVERVIEW */
.mkt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mkt-card{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:12px 14px}
.mc-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:1px;margin-bottom:5px}
.mc-val{font-family:'Space Mono',monospace;font-size:13px;font-weight:700}
.mc-sub{font-size:10px;color:var(--mu2);margin-top:2px}
/* LOADING */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px;flex:1}
.spinner{width:28px;height:28px;border:2px solid var(--b2);border-top-color:var(--acc);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-family:'Space Mono',monospace;font-size:10px;color:var(--mu);letter-spacing:1px}
.err-box{background:var(--red2);border:1px solid rgba(224,59,59,0.3);border-radius:8px;padding:13px 15px;font-size:12px;color:var(--red)}
/* WARN BOX */
.warn-box{background:var(--ylw2);border:1px solid rgba(212,168,0,0.25);border-radius:8px;padding:13px 15px}
.warn-title{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--ylw);margin-bottom:8px}
.warn-item{font-size:12px;color:#c49a00;margin-bottom:4px}
/* NEXT DAY PLAN */
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan-box{background:var(--s2);border-radius:8px;padding:12px 14px}
.plan-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu);letter-spacing:1px;margin-bottom:6px}
.plan-val{font-size:13px;line-height:1.6;color:var(--tx)}
.plan-val b{font-weight:600;color:var(--acc)}
/* BIAS BAR */
.bias-bar-wrap{display:flex;align-items:center;gap:10px;margin-top:6px}
.bias-bar{flex:1;height:6px;background:var(--b2);border-radius:3px;overflow:hidden;position:relative}
.bias-fill-long{height:100%;background:var(--grn);border-radius:3px}
.bias-fill-short{height:100%;background:var(--red);border-radius:3px;margin-left:auto}
.bias-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--mu2)}
/* STATUS DOT */
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px}
.dot-grn{background:var(--grn)}.dot-red{background:var(--red)}.dot-ylw{background:var(--ylw)}.dot-mu{background:var(--mu)}
@media(max-width:780px){.wrap{grid-template-columns:1fr}.panel{border-right:none;border-bottom:1px solid var(--b1)}.mkt-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <span class="logo">BTC / USDT</span>
    <span class="pill pill-acc">FUTURES ANALYZER</span>
    <span class="pill pill-mu" id="last-fetch-lbl">NO DATA</span>
  </div>
  <div class="hdr-right">
    <span class="cache-info" id="cache-size"></span>
    <button class="btn-clear" onclick="clearCache()">CLEAR CACHE</button>
  </div>
</div>

<div class="wrap">
  <!-- LEFT PANEL -->
  <div class="panel">

    <div>
      <div class="sec-lbl">Timeframes to Fetch</div>
      <div class="row2">
        <div class="field">
          <label>Entry TF</label>
          <select id="entry-tf">
            <option value="5m">5 Min</option>
            <option value="15m" selected>15 Min</option>
            <option value="30m">30 Min</option>
            <option value="1h">1 Hour</option>
          </select>
        </div>
        <div class="field">
          <label>Trend TF</label>
          <select id="trend-tf">
            <option value="1h">1 Hour</option>
            <option value="4h" selected>4 Hour</option>
            <option value="1d">Daily</option>
          </select>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Candles per TF</label>
      <select id="limit">
        <option value="50">50 candles</option>
        <option value="100" selected>100 candles</option>
        <option value="200">200 candles</option>
      </select>
    </div>

    <div class="field">
      <label>Cache Duration</label>
      <select id="cache-ttl">
        <option value="300000">5 min (scalping)</option>
        <option value="900000" selected>15 min (default)</option>
        <option value="3600000">1 hour (swing)</option>
      </select>
    </div>

    <button class="btn-fetch" id="fetch-btn" onclick="fetchAll()">
      <span id="fetch-ico">↓</span>
      <span id="fetch-lbl">FETCH BINANCE DATA</span>
    </button>

    <!-- Live data snapshot -->
    <div id="data-snapshot" style="display:none">
      <div class="sec-lbl">Live Snapshot</div>
      <div class="data-grid" id="snapshot-grid"></div>
      <div style="margin-top:10px">
        <div class="sec-lbl">Entry TF Candles (last 8)</div>
        <div class="mini-table" id="mini-table"></div>
      </div>
    </div>

    <hr class="divider">

    <div>
      <div class="sec-lbl">Your Context (optional)</div>
      <div class="field">
        <label>Extra S/R Levels</label>
        <input type="text" id="sr" placeholder="e.g. Support 83000, Res 85500">
      </div>
      <div style="margin-top:10px" class="field">
        <label>Strategy / Notes</label>
        <textarea id="strategy" placeholder="e.g. EMA 9/21 cross, SMC, only trade NY session..."></textarea>
      </div>
    </div>

    <button class="btn-analyze" id="analyze-btn" onclick="analyze()" disabled>ANALYZE → NEXT DAY PLAN</button>

  </div>

  <!-- OUTPUT -->
  <div class="output" id="output">
    <div class="empty">
      <div class="empty-ico">◈</div>
      <p>Fetch data then hit Analyze</p>
      <p style="font-size:11px;color:var(--mu);margin-top:4px">Cached data reused until TTL expires</p>
    </div>
  </div>
</div>

<script>
const CACHE_KEY = 'btc_analyzer_cache';
let cachedData = null;

function saveCache(data) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
    updateCacheInfo();
  } catch(e) { console.warn('Cache save failed', e); }
}

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

function clearCache() {
  localStorage.removeItem(CACHE_KEY);
  cachedData = null;
  document.getElementById('last-fetch-lbl').textContent = 'NO DATA';
  document.getElementById('last-fetch-lbl').className = 'pill pill-mu';
  document.getElementById('cache-size').textContent = '';
  document.getElementById('data-snapshot').style.display = 'none';
  document.getElementById('analyze-btn').disabled = true;
  document.getElementById('output').innerHTML = '<div class="empty"><div class="empty-ico">◈</div><p>Cache cleared. Fetch fresh data.</p></div>';
  updateCacheInfo();
}

function updateCacheInfo() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw) {
      const kb = (raw.length / 1024).toFixed(1);
      document.getElementById('cache-size').textContent = kb + ' KB cached';
    } else {
      document.getElementById('cache-size').textContent = '';
    }
  } catch(e) {}
}

function isCacheValid(cached, ttl) {
  if (!cached) return false;
  return (Date.now() - cached.ts) < ttl;
}

function fmtTime(ts) {
  return new Date(ts).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false });
}

async function fetchBinance(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('Binance API error: ' + res.status);
  return res.json();
}

async function fetchAll() {
  const ttl = parseInt(document.getElementById('cache-ttl').value);
  const cached = loadCache();

  if (isCacheValid(cached, ttl)) {
    cachedData = cached.data;
    const age = Math.round((Date.now() - cached.ts) / 1000);
    document.getElementById('last-fetch-lbl').textContent = 'CACHED ' + age + 's AGO';
    document.getElementById('last-fetch-lbl').className = 'pill pill-grn';
    renderSnapshot(cachedData);
    document.getElementById('analyze-btn').disabled = false;
    return;
  }

  const entryTf = document.getElementById('entry-tf').value;
  const trendTf = document.getElementById('trend-tf').value;
  const limit = document.getElementById('limit').value;

  const btn = document.getElementById('fetch-btn');
  btn.disabled = true;
  document.getElementById('fetch-ico').textContent = '⟳';
  document.getElementById('fetch-lbl').textContent = 'FETCHING...';

  try {
    const BASE = 'https://fapi.binance.com';
    const [
      entryKlines,
      trendKlines,
      dailyKlines,
      fundingRates,
      openInterest,
      ticker24h,
      premiumIndex
    ] = await Promise.all([
      fetchBinance(`${BASE}/fapi/v1/klines?symbol=BTCUSDT&interval=${entryTf}&limit=${limit}`),
      fetchBinance(`${BASE}/fapi/v1/klines?symbol=BTCUSDT&interval=${trendTf}&limit=50`),
      fetchBinance(`${BASE}/fapi/v1/klines?symbol=BTCUSDT&interval=1d&limit=7`),
      fetchBinance(`${BASE}/fapi/v1/fundingRate?symbol=BTCUSDT&limit=8`),
      fetchBinance(`${BASE}/fapi/v1/openInterest?symbol=BTCUSDT`),
      fetchBinance(`${BASE}/fapi/v1/ticker/24hr?symbol=BTCUSDT`),
      fetchBinance(`${BASE}/fapi/v1/premiumIndex?symbol=BTCUSDT`)
    ]);

    const data = {
      entryTf, trendTf, limit: parseInt(limit),
      entryKlines: entryKlines.map(k => ({
        t: k[0], o: parseFloat(k[1]), h: parseFloat(k[2]),
        l: parseFloat(k[3]), c: parseFloat(k[4]), v: parseFloat(k[5]),
        qt: parseFloat(k[7]), trades: parseInt(k[8]),
        tbv: parseFloat(k[9])
      })),
      trendKlines: trendKlines.map(k => ({
        t: k[0], o: parseFloat(k[1]), h: parseFloat(k[2]),
        l: parseFloat(k[3]), c: parseFloat(k[4]), v: parseFloat(k[5])
      })),
      dailyKlines: dailyKlines.map(k => ({
        t: k[0], o: parseFloat(k[1]), h: parseFloat(k[2]),
        l: parseFloat(k[3]), c: parseFloat(k[4]), v: parseFloat(k[5])
      })),
      fundingRates: fundingRates.map(f => ({
        t: parseInt(f.fundingTime),
        rate: parseFloat(f.fundingRate)
      })),
      openInterest: { oi: parseFloat(openInterest.openInterest), t: openInterest.time },
      ticker24h: {
        price: parseFloat(ticker24h.lastPrice),
        change: parseFloat(ticker24h.priceChangePercent),
        high: parseFloat(ticker24h.highPrice),
        low: parseFloat(ticker24h.lowPrice),
        volume: parseFloat(ticker24h.volume),
        quoteVolume: parseFloat(ticker24h.quoteVolume)
      },
      markPrice: parseFloat(premiumIndex.markPrice),
      indexPrice: parseFloat(premiumIndex.indexPrice),
      nextFunding: parseFloat(premiumIndex.lastFundingRate),
      fetchedAt: Date.now()
    };

    cachedData = data;
    saveCache(data);
    renderSnapshot(data);
    document.getElementById('last-fetch-lbl').textContent = 'LIVE · ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    document.getElementById('last-fetch-lbl').className = 'pill pill-grn';
    document.getElementById('analyze-btn').disabled = false;

  } catch(err) {
    document.getElementById('output').innerHTML = '<div class="err-box">Fetch failed: ' + err.message + '<br><br>Note: Binance API may be blocked in your region. Try a VPN or check your connection.</div>';
    document.getElementById('last-fetch-lbl').textContent = 'FETCH FAILED';
    document.getElementById('last-fetch-lbl').className = 'pill pill-red';
  } finally {
    btn.disabled = false;
    document.getElementById('fetch-ico').textContent = '↓';
    document.getElementById('fetch-lbl').textContent = 'FETCH BINANCE DATA';
  }
}

function renderSnapshot(d) {
  const cur = d.ticker24h.price;
  const chg = d.ticker24h.change;
  const fr = d.nextFunding * 100;
  const frSign = fr >= 0 ? '+' : '';
  const frColor = fr > 0.01 ? 'dc-red' : fr < -0.01 ? 'dc-grn' : 'dc-acc';

  const trendCandles = d.trendKlines;
  const last4h = trendCandles[trendCandles.length - 1];
  const prev4h = trendCandles[trendCandles.length - 2];
  const trendDir = last4h.c > last4h.o ? '↑ BULL' : '↓ BEAR';
  const trendColor = last4h.c > last4h.o ? 'dc-grn' : 'dc-red';

  document.getElementById('snapshot-grid').innerHTML =
    '<div class="data-card"><div class="dc-label">MARK PRICE</div><div class="dc-val dc-acc">$' + cur.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}) + '</div><div class="dc-sub ' + (chg>=0?'dc-grn':'dc-red') + '">' + (chg>=0?'+':'') + chg.toFixed(2) + '% 24h</div></div>' +
    '<div class="data-card"><div class="dc-label">FUNDING RATE</div><div class="dc-val ' + frColor + '">' + frSign + fr.toFixed(4) + '%</div><div class="dc-sub">per 8h interval</div></div>' +
    '<div class="data-card"><div class="dc-label">' + d.trendTf.toUpperCase() + ' TREND</div><div class="dc-val ' + trendColor + '">' + trendDir + '</div><div class="dc-sub">last close $' + last4h.c.toFixed(0) + '</div></div>' +
    '<div class="data-card"><div class="dc-label">OI</div><div class="dc-val">' + parseFloat(d.openInterest.oi).toFixed(0) + '</div><div class="dc-sub">BTC open interest</div></div>';

  const recent8 = d.entryKlines.slice(-8);
  const ts = t => new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  let tbl = '<div class="mt-head"><span>TIME</span><span>O</span><span>H</span><span>L</span><span>C</span><span>VOL</span></div>';
  for (const c of recent8) {
    const bull = c.c >= c.o;
    tbl += '<div class="mt-row ' + (bull?'mt-bull':'mt-bear') + '"><span>' + ts(c.t) + '</span><span>' + c.o.toFixed(0) + '</span><span>' + c.h.toFixed(0) + '</span><span>' + c.l.toFixed(0) + '</span><span>' + c.c.toFixed(0) + '</span><span>' + c.v.toFixed(1) + '</span></div>';
  }
  document.getElementById('mini-table').innerHTML = tbl;
  document.getElementById('data-snapshot').style.display = 'block';
  updateCacheInfo();
}

function buildPrompt(d, sr, strategy) {
  const entryCandles = d.entryKlines.slice(-50);
  const trendCandles = d.trendKlines.slice(-20);
  const dailyCandles = d.dailyKlines;

  const fmtC = c => (c.c >= c.o ? 'BULL' : 'BEAR') +
    ' O:' + c.o.toFixed(1) + ' H:' + c.h.toFixed(1) + ' L:' + c.l.toFixed(1) + ' C:' + c.c.toFixed(1) +
    ' V:' + c.v.toFixed(2) + ' BuyV:' + (c.tbv ? c.tbv.toFixed(2) : 'N/A');

  const avgFunding = d.fundingRates.reduce((s,f) => s + f.rate, 0) / d.fundingRates.length;
  const fr = d.nextFunding * 100;

  const dailyHigh = Math.max(...d.dailyKlines.map(c => c.h));
  const dailyLow = Math.min(...d.dailyKlines.map(c => c.l));
  const weeklyRange = dailyHigh - dailyLow;

  return `You are a professional BTC/USDT futures trader and analyst. Analyze the following comprehensive market data and produce a detailed trading plan for the NEXT TRADING DAY.

=== MARKET SNAPSHOT (fetched ${fmtTime(d.fetchedAt)}) ===
Mark Price: $${d.markPrice.toFixed(2)}
Index Price: $${d.indexPrice.toFixed(2)}
24h Change: ${d.ticker24h.change.toFixed(2)}%
24h High: $${d.ticker24h.high.toFixed(2)}
24h Low: $${d.ticker24h.low.toFixed(2)}
24h Volume: ${d.ticker24h.volume.toFixed(0)} BTC ($${(d.ticker24h.quoteVolume/1e9).toFixed(2)}B)
Open Interest: ${parseFloat(d.openInterest.oi).toFixed(0)} BTC

=== FUNDING RATE ===
Current/Next: ${(fr).toFixed(4)}%
Avg last 8 intervals: ${(avgFunding*100).toFixed(4)}%
(Positive = longs pay shorts. Negative = shorts pay longs.)

=== DAILY CANDLES (last 7 days) ===
${dailyCandles.map((c,i) => '[D'+(i+1)+'] ' + fmtC(c)).join('\n')}
7-day High: $${dailyHigh.toFixed(2)} | 7-day Low: $${dailyLow.toFixed(2)} | Range: $${weeklyRange.toFixed(2)}

=== ${d.trendTf.toUpperCase()} TREND CANDLES (last 20) ===
${trendCandles.map((c,i) => '['+d.trendTf+(i+1)+'] ' + fmtC(c)).join('\n')}

=== ${d.entryTf.toUpperCase()} ENTRY CANDLES (last 50) ===
${entryCandles.map((c,i) => '['+d.entryTf+(i+1)+'] ' + fmtC(c)).join('\n')}

${sr ? '=== TRADER S/R LEVELS ===\n' + sr + '\n' : ''}
${strategy ? '=== TRADER STRATEGY ===\n' + strategy + '\n' : ''}

=== YOUR TASK ===
Produce a NEXT DAY trading plan. Be specific with price levels. Use all data above including funding rate, volume, buy volume delta, candle structure across all timeframes.

Respond ONLY with valid JSON, no markdown, no extra text:
{
  "signal": "LONG" | "SHORT" | "WAIT" | "NEUTRAL",
  "confidence": 0-100,
  "bias": "A 1-2 sentence overall market bias for tomorrow",
  "entry_zone": "specific price range to enter e.g. 83200-83500",
  "entry": "ideal entry price string",
  "tp1": "first take profit price",
  "tp2": "second take profit price (further target)",
  "sl": "stop loss price",
  "rr": "risk:reward ratio e.g. 1:2.5",
  "patterns": ["up to 6 candle patterns or setups detected"],
  "funding_note": "one sentence on what funding rate means for this trade",
  "daily_structure": "2-3 sentences on daily/4H structure and key levels",
  "entry_plan": "2-3 sentences on exactly when and how to enter based on entry TF",
  "exit_plan": "2-3 sentences on when to take profit and move SL",
  "invalidation": "one sentence on what price action would invalidate this setup",
  "key_levels": { "support": ["array of support levels as strings"], "resistance": ["array of resistance levels as strings"] },
  "warnings": ["up to 4 risk warnings"],
  "session_notes": "note about which trading session (London/NY) is best to watch for this setup given Phnom Penh timezone (UTC+7)"
}`;
}

async function analyze() {
  if (!cachedData) { alert('Fetch data first.'); return; }
  const sr = document.getElementById('sr').value;
  const strategy = document.getElementById('strategy').value;

  const btn = document.getElementById('analyze-btn');
  btn.disabled = true;
  document.getElementById('output').innerHTML =
    '<div class="loading-wrap"><div class="spinner"></div><div class="loading-txt">ANALYZING MARKET DATA...</div></div>';

  try {
    const prompt = buildPrompt(cachedData, sr, strategy);
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: 'You are a professional crypto futures analyst. Always respond with valid JSON only. No markdown fences, no preamble.',
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const apiData = await res.json();
    const text = apiData.content?.find(b => b.type === 'text')?.text || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const result = JSON.parse(clean);
    renderResult(result, cachedData);
  } catch(err) {
    document.getElementById('output').innerHTML = '<div class="err-box">Analysis failed: ' + err.message + '</div>';
  } finally {
    btn.disabled = false;
  }
}

function renderResult(r, d) {
  const sbClass = { LONG:'sb-long', SHORT:'sb-short', WAIT:'sb-wait', NEUTRAL:'sb-neutral' }[r.signal] || 'sb-neutral';
  const conf = Math.min(100, Math.max(0, parseInt(r.confidence) || 50));
  const cur = d.ticker24h.price;
  const fr = (d.nextFunding * 100).toFixed(4);
  const frSign = d.nextFunding >= 0 ? '+' : '';
  const chg = d.ticker24h.change;

  let mktHtml = '<div class="mkt-grid">' +
    '<div class="mkt-card"><div class="mc-lbl">PRICE</div><div class="mc-val" style="color:var(--acc)">$' + cur.toLocaleString('en-US',{minimumFractionDigits:1}) + '</div><div class="mc-sub ' + (chg>=0?'dc-grn':'dc-red') + '">' + (chg>=0?'+':'') + chg.toFixed(2) + '% 24h</div></div>' +
    '<div class="mkt-card"><div class="mc-lbl">FUNDING</div><div class="mc-val" style="color:' + (d.nextFunding>0.0001?'var(--red)':d.nextFunding<-0.0001?'var(--grn)':'var(--ylw)') + '">' + frSign + fr + '%</div><div class="mc-sub">next interval</div></div>' +
    '<div class="mkt-card"><div class="mc-lbl">OPEN INT.</div><div class="mc-val">' + parseFloat(d.openInterest.oi).toFixed(0) + '</div><div class="mc-sub">BTC</div></div>' +
    '<div class="mkt-card"><div class="mc-lbl">24H VOL</div><div class="mc-val">$' + (d.ticker24h.quoteVolume/1e9).toFixed(1) + 'B</div><div class="mc-sub">' + d.ticker24h.volume.toFixed(0) + ' BTC</div></div>' +
    '</div>';

  let lvlsHtml = '';
  if (r.entry || r.tp1 || r.sl) {
    lvlsHtml = '<div class="lvl-row">' +
      '<div class="lvl-box"><div class="lvl-name">ENTRY ZONE</div><div class="lvl-val lv-e">' + (r.entry_zone || r.entry || '—') + '</div><div class="lvl-sub">ideal: ' + (r.entry || '—') + '</div></div>' +
      '<div class="lvl-box"><div class="lvl-name">TP1 / TP2</div><div class="lvl-val lv-t">' + (r.tp1 || '—') + '</div><div class="lvl-sub">ext: ' + (r.tp2 || '—') + '</div></div>' +
      '<div class="lvl-box"><div class="lvl-name">STOP LOSS</div><div class="lvl-val lv-s">' + (r.sl || '—') + '</div><div class="lvl-sub">RR ' + (r.rr || '—') + '</div></div>' +
      '</div>';
  }

  let keyLvlHtml = '';
  if (r.key_levels) {
    const sup = (r.key_levels.support || []).map(l => '<span class="tag" style="color:var(--grn)">S: ' + l + '</span>').join('');
    const res = (r.key_levels.resistance || []).map(l => '<span class="tag" style="color:var(--red)">R: ' + l + '</span>').join('');
    keyLvlHtml = '<div class="sec-box"><div class="sec-box-title">Key Levels</div><div class="tag-row">' + sup + res + '</div></div>';
  }

  let patternsHtml = '';
  if (r.patterns && r.patterns.length) {
    patternsHtml = '<div class="sec-box"><div class="sec-box-title">Patterns / Setups</div><div class="tag-row">' + r.patterns.map(p => '<span class="tag">' + p + '</span>').join('') + '</div></div>';
  }

  let planHtml = '<div class="plan-grid">' +
    '<div class="plan-box"><div class="plan-lbl">DAILY STRUCTURE</div><div class="plan-val">' + (r.daily_structure || '—') + '</div></div>' +
    '<div class="plan-box"><div class="plan-lbl">ENTRY PLAN</div><div class="plan-val">' + (r.entry_plan || '—') + '</div></div>' +
    '<div class="plan-box"><div class="plan-lbl">EXIT PLAN</div><div class="plan-val">' + (r.exit_plan || '—') + '</div></div>' +
    '<div class="plan-box"><div class="plan-lbl">INVALIDATION</div><div class="plan-val" style="color:var(--red)">' + (r.invalidation || '—') + '</div></div>' +
    '</div>';

  let fundingHtml = r.funding_note
    ? '<div class="sec-box"><div class="sec-box-title">Funding Note</div><div class="plan-val">' + r.funding_note + '</div></div>'
    : '';

  let sessionHtml = r.session_notes
    ? '<div class="sec-box"><div class="sec-box-title">Session Notes (Phnom Penh UTC+7)</div><div class="plan-val">' + r.session_notes + '</div></div>'
    : '';

  let warnHtml = '';
  if (r.warnings && r.warnings.length) {
    warnHtml = '<div class="warn-box"><div class="warn-title">WARNINGS</div>' + r.warnings.map(w => '<div class="warn-item">⚠ ' + w + '</div>').join('') + '</div>';
  }

  let biasHtml = '';
  if (r.bias) {
    biasHtml = '<div class="sec-box" style="border-left:2px solid var(--acc)"><div class="sec-box-title">Market Bias</div><div class="analysis-txt">' + r.bias + '</div></div>';
  }

  document.getElementById('output').innerHTML =
    mktHtml +
    '<div class="sig-card">' +
      '<div class="sig-hdr">' +
        '<div class="sig-hdr-l">' +
          '<span style="font-family:Space Mono,monospace;font-size:9px;color:var(--mu);letter-spacing:1px">SIGNAL</span>' +
          '<span class="sig-badge ' + sbClass + '">' + (r.signal || 'NEUTRAL') + '</span>' +
          '<span class="pill pill-mu">' + d.entryTf + ' entry · ' + d.trendTf + ' trend</span>' +
        '</div>' +
        '<div class="conf-wrap"><span class="conf-lbl">Confidence</span><div class="conf-bar"><div class="conf-fill" style="width:' + conf + '%"></div></div><span class="conf-pct">' + conf + '%</span></div>' +
      '</div>' +
      '<div class="sig-body">' +
        biasHtml +
        lvlsHtml +
        keyLvlHtml +
        patternsHtml +
        planHtml +
        fundingHtml +
        sessionHtml +
        warnHtml +
      '</div>' +
    '</div>' +
    '<div style="font-size:10px;color:var(--mu);text-align:center;padding:4px 0;font-family:Space Mono,monospace">AI ANALYSIS ONLY · NOT FINANCIAL ADVICE · ALWAYS MANAGE YOUR OWN RISK</div>';
}

// On load — restore cache if valid
(function init() {
  updateCacheInfo();
  const cached = loadCache();
  if (cached) {
    const age = Math.round((Date.now() - cached.ts) / 1000);
    document.getElementById('last-fetch-lbl').textContent = 'CACHED ' + age + 's AGO';
    document.getElementById('last-fetch-lbl').className = 'pill pill-grn';
    cachedData = cached.data;
    renderSnapshot(cached.data);
    document.getElementById('analyze-btn').disabled = false;
  }
})();
</script>
</body>
</html>
